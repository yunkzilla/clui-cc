<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mira app icon.
  Bold geometric M wordmark on Pantone Tangerine Tango (17-1463).
  Deep V apex with a softly rounded valley — confident, modern, no fussy detail.
  Designed at 1024 master; scales cleanly to 16×16.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Tangerine Tango background, slightly deepened at the bottom -->
    <linearGradient id="mira-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#f25a30"/>
      <stop offset="1"   stop-color="#d23a10"/>
    </linearGradient>

    <!-- Subtle top highlight -->
    <linearGradient id="mira-hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft drop shadow under the M for depth -->
    <filter id="mira-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background plate (squircle) -->
  <rect width="1024" height="1024" rx="228" fill="url(#mira-bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#mira-hi)"/>

  <!--
    M letterform — single closed path traced clockwise.
    Vertices:
      (240,240) outer top-left
      (350,240) inner top of left leg
      (488,715) bottom of left diagonal (just before V apex)
      Q (512,762) (536,715)   smoothly-rounded V apex
      (674,240) inner top of right leg
      (784,240) outer top-right
      (784,784) bottom-right
      (240,784) bottom-left
  -->
  <path
    d="M 240 240
       L 350 240
       L 488 715
       Q 512 762 536 715
       L 674 240
       L 784 240
       L 784 784
       L 240 784 Z"
    fill="#ffffff"
    filter="url(#mira-shadow)"/>
</svg>
