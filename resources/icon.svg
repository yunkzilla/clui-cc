<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hatch app icon — porthole / hatch wheel
  Designed for 1024×1024 master; scales cleanly down to 16×16.
  Apple icon design uses a rounded-rect "squircle" background plate.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background plate: warm dark gradient (Marquina marble base) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1d18"/>
      <stop offset="1" stop-color="#0d0c0a"/>
    </linearGradient>

    <!-- Subtle inner highlight along the top edge -->
    <linearGradient id="bgHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Brushed-brass accent gradient for the porthole stroke -->
    <linearGradient id="brassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#e5d39a"/>
      <stop offset="0.5" stop-color="#c9a96a"/>
      <stop offset="1"   stop-color="#8a6d3a"/>
    </linearGradient>

    <!-- Inner glow behind the hub -->
    <radialGradient id="hubGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#d4b888" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#d4b888" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft drop shadow for the porthole structure -->
    <filter id="hatchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ─── Background plate: rounded squircle ─── -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bgHighlight)"/>

  <!-- ─── Hatch structure ─── -->
  <g filter="url(#hatchShadow)">
    <!-- Inner glow halo behind the wheel -->
    <circle cx="512" cy="512" r="320" fill="url(#hubGlow)"/>

    <!-- Outer porthole frame -->
    <circle cx="512" cy="512" r="320" fill="none" stroke="url(#brassGrad)" stroke-width="36"/>

    <!-- Inner thin ring for depth -->
    <circle cx="512" cy="512" r="278" fill="none" stroke="#c9a96a" stroke-width="3" stroke-opacity="0.45"/>

    <!-- Rivets — eight evenly-spaced at compass corners -->
    <g fill="#d4b888">
      <!-- 45° pairs (corners) -->
      <circle cx="285" cy="285" r="14"/>
      <circle cx="739" cy="285" r="14"/>
      <circle cx="285" cy="739" r="14"/>
      <circle cx="739" cy="739" r="14"/>
    </g>

    <!-- Wheel-handle spokes — cross, reaching from outer ring inward to the central hub -->
    <g stroke="url(#brassGrad)" stroke-width="28" stroke-linecap="round">
      <line x1="512" y1="226" x2="512" y2="430"/>
      <line x1="512" y1="594" x2="512" y2="798"/>
      <line x1="226" y1="512" x2="430" y2="512"/>
      <line x1="594" y1="512" x2="798" y2="512"/>
    </g>

    <!-- Central hub -->
    <circle cx="512" cy="512" r="64" fill="url(#brassGrad)"/>
    <circle cx="512" cy="512" r="64" fill="none" stroke="#8a6d3a" stroke-width="3" stroke-opacity="0.5"/>
    <!-- Hub speck highlight -->
    <circle cx="492" cy="492" r="14" fill="#ffe7b8" fill-opacity="0.85"/>
  </g>
</svg>
