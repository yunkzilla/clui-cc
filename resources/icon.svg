<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mira Deck logo — v1
  Cyberpunk: bold M floating over a terminal baseline + blinking cursor.
  Near-black plate with hot-amber neon glow.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Near-black plate with subtle navy tint, deeper toward the bottom -->
    <linearGradient id="md-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0c1020"/>
      <stop offset="0.6" stop-color="#070a16"/>
      <stop offset="1"   stop-color="#03050d"/>
    </linearGradient>

    <!-- Vignette pushes focus to the M -->
    <radialGradient id="md-vignette" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Outer neon glow on the M — subtle, just a hint of warmth -->
    <filter id="md-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <!-- Tighter inner glow on the cursor / baseline -->
    <filter id="md-glow-tight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background plate (squircle) -->
  <rect width="1024" height="1024" rx="228" fill="url(#md-bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#md-vignette)"/>

  <!-- Subtle CRT scan-line hint -->
  <g opacity="0.05" stroke="#7ad6ff" stroke-width="1">
    <line x1="0" y1="220" x2="1024" y2="220"/>
    <line x1="0" y1="380" x2="1024" y2="380"/>
    <line x1="0" y1="540" x2="1024" y2="540"/>
    <line x1="0" y1="700" x2="1024" y2="700"/>
  </g>

  <!--
    The M letterform — same geometry as Mira's mark, sized down so a
    terminal baseline + cursor sit cleanly underneath.
    Bounds: x 260–764, y 188–688. V apex around y=628.
  -->
  <g>
    <!-- Outer neon halo (blurred copy of the M) -->
    <path
      d="M 260 188
         L 370 188
         L 498 620
         Q 512 660 526 620
         L 654 188
         L 764 188
         L 764 688
         L 260 688 Z"
      fill="#ff9a2c"
      filter="url(#md-glow)"
      opacity="0.50"/>

    <!-- Main M body -->
    <path
      d="M 260 188
         L 370 188
         L 498 620
         Q 512 660 526 620
         L 654 188
         L 764 188
         L 764 688
         L 260 688 Z"
      fill="#fff3d4"/>
  </g>

  <!-- Terminal baseline — a thin glowing rail spanning most of the width -->
  <g>
    <line x1="220" y1="800" x2="704" y2="800"
          stroke="#ff9a2c" stroke-width="6" stroke-linecap="round"
          filter="url(#md-glow-tight)" opacity="0.95"/>
    <line x1="220" y1="800" x2="704" y2="800"
          stroke="#fff3d4" stroke-width="3" stroke-linecap="round"/>

    <!-- Blinking-style cursor block at the right end of the line -->
    <rect x="724" y="772" width="56" height="56" rx="4"
          fill="#ff9a2c" filter="url(#md-glow-tight)" opacity="0.95"/>
    <rect x="724" y="772" width="56" height="56" rx="4"
          fill="#fff3d4"/>
  </g>
</svg>
